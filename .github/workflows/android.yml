name: Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/jh-getway-release.keystore
          key: jh-getway-release-signing-v1
      - name: Create stable signing key on first build
        env:
          JH_SIGNING_PASSWORD: ${{ secrets.JH_SIGNING_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/jh-getway-release.keystore" ]; then
            if [ -z "$JH_SIGNING_PASSWORD" ]; then
              echo "::warning::JH_SIGNING_PASSWORD secret not set; fork/PR build will use the default debug signing key instead of the stable one"
              exit 0
            fi
            keytool -genkeypair -v \
              -keystore "$HOME/.android/jh-getway-release.keystore" \
              -storepass "$JH_SIGNING_PASSWORD" -keypass "$JH_SIGNING_PASSWORD" \
              -alias jh_gateway -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=JH GetWay, OU=Personal, O=JH, L=Local, S=Local, C=BD"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          retention-days: 7
      - name: Build debug APK
        env:
          JH_SIGNING_PASSWORD: ${{ secrets.JH_SIGNING_PASSWORD }}
        run: gradle assembleDebug
      - name: Verify debug APK
        run: bash scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Build release APK
        env:
          JH_SIGNING_PASSWORD: ${{ secrets.JH_SIGNING_PASSWORD }}
        run: |
          if [ -z "$JH_SIGNING_PASSWORD" ]; then
            if [ "${{ github.ref }}" = "refs/tags/${GITHUB_REF_NAME}" ] || [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "::error::JH_SIGNING_PASSWORD secret is required for release builds; refusing to publish an unsigned release"
              exit 1
            fi
            echo "::warning::JH_SIGNING_PASSWORD secret not set; skipping the signed release build (fork/PR build)"
            exit 0
          fi
          gradle assembleRelease
      - name: Verify release APK
        if: hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        run: bash scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk
      - name: Render resolved dependency tree
        run: |
          gradle app:dependencies --configuration releaseRuntimeClasspath > dependency-tree.txt
          gradle app:dependencies --configuration debugUnitTestRuntimeClasspath > dependency-tree-test.txt
      - name: Upload dependency tree
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: |
            dependency-tree.txt
            dependency-tree-test.txt
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jh-getway-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: jh-getway-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Generate update metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version_code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          # The updater installs the release APK: it is signed with the same stable
          # certificate as the debug APK, so it installs over an existing install.
          apk=app/build/outputs/apk/release/app-release.apk
          apk_name=app-release.apk
          if [ ! -f "$apk" ]; then
            apk=app/build/outputs/apk/debug/app-debug.apk
            apk_name=app-debug.apk
          fi
          sha256=$(sha256sum "$apk" | awk '{print $1}')
          apk_url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$apk_name"
          cat > latest.json <<EOF
          {"packageName":"com.jh.gateway","versionCode":$version_code,"versionName":"$version_name","apkName":"$apk_name","apkUrl":"$apk_url","sha256":"$sha256"}
          EOF
          cat latest.json
      - name: Publish release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            latest.json
          body: |
            **v0.7.3 — Gateway security and usability**

            New in this release:
            - The gateway key is now shown only in Settings, not on the home screen, to reduce exposure risk
            - The "Create API" feature in the Playground has been removed; API keys are now added only via the Providers tab
            - Added a Playground tab for quick access to the Playground interface
            - The update system is now accessible throughout the app: a button in the top bar and a row in Settings
            - The update system checks for updates at startup (once daily) so the badge appears without opening the page
            - Fixed the timeoutMs field when adding a provider in the editor
            - The home screen now opens directly into chat with providers from the Providers tab
            - Removed duplicate navigation items and cleaned up navigation
            - If the device keystore was reset, the gateway issues a fresh key and the Providers screen tells you which keys need to be entered again
            - Provider health warnings are no longer silenced for other providers
            - Sticky session routes are capped instead of growing with every conversation
            - Faster requests: API keys are decrypted once and cached instead of on every call
            - About 50 previously hardcoded English strings are now translated, including in the Bangla locale
            - The in-app updater keeps the downloaded update after a restart and reads the version code correctly

            Previous highlights:
            - Branded cold-launch splash (JH GetWay rises, settles at center, then JH Soft Corporation); honors reduced-motion and runs once per cold launch
            - In-app updater verifies the downloaded APK's package name, versionCode and signing certificate before offering the install, and re-verifies at install time
            - Release build published alongside the debug APK, both signed with the same stable certificate so updates install without uninstalling
            - CI verifies every APK (package, version, signature, SHA-256) before publishing and fails the release on mismatch
            - Signing password moved to a GitHub Secret; no fallback password anywhere in the build
            - Resolved dependency trees published as a CI artifact for the license audit

            Previous highlights:
            - Dedicated in-app update screen with Android Download Manager download and install guidance
            - Persistent Best/Good/Basic routing chain with reorder controls
            - Privacy-safe request logs and usage summary dashboard
            - Password-protected backup export/import with file picker
            - Optional app lock with device PIN/biometrics and screenshot protection
            - Anthropic/Responses streaming bridges, tool-call translation, sticky routing, round-robin, and token usage
            - Retry-After aware provider cooldowns, provider health state and rate-limited failure notifications
            - LAN IP allowlist, per-IP rate limiting, and protocol adapter fixture tests
            - Model aliases and provider-specific upstream model mapping
            - Light, Dark, and System appearance modes; English/Bangla interface
