name: Android Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/jh-getway-release.keystore
          key: jh-getway-release-signing-v1
      - name: Create stable signing key on first build
        env:
          JH_SIGNING_PASSWORD: jh-getway-stable-signing-v1
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/jh-getway-release.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/jh-getway-release.keystore" \
              -storepass "$JH_SIGNING_PASSWORD" -keypass "$JH_SIGNING_PASSWORD" \
              -alias jh_gateway -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=JH GetWay, OU=Personal, O=JH, L=Local, S=Local, C=BD"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        env:
          JH_SIGNING_PASSWORD: jh-getway-stable-signing-v1
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jh-getway-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Generate update metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version_code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          sha256=$(sha256sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')
          apk_url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-debug.apk"
          cat > latest.json <<EOF
          {"packageName":"com.jh.gateway","versionCode":$version_code,"versionName":"$version_name","apkName":"app-debug.apk","apkUrl":"$apk_url","sha256":"$sha256"}
          EOF
      - name: Publish release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            latest.json
          body: |
            - Dedicated in-app update screen
            - Android Download Manager download with notification
            - Release notes and GitHub release fallback
            - Install update action with Android permission guidance
            - Persistent Best/Good/Basic routing chain with reorder controls
            - Privacy-safe request logs and usage summary dashboard
            - Password-protected backup export/import with file picker
            - Stable signing certificate for future no-uninstall updates
            - App-owned update download with visible progress and later install
            - Help and setup guide for tools, battery settings, and troubleshooting
            - Optional app lock with device PIN/biometrics and screenshot protection
            - Dynamic version shown in the app, health endpoint, and Home address
            - Official JH GetWay launcher logo supplied by the owner
            - Persistent downloaded update recovery after closing the update screen
            - Stale APK cleanup and reliable forced update check
            - Persistent pending-update queue with retry after closing the app
            - Persistent Light, Dark, and System appearance modes
            - Updater retry state and provider cooldown on transient server failures
            - Anthropic/Responses streaming bridges, tool-call translation, sticky routing, round-robin, and token usage
            - APK validation and Android package-installer update flow
            - Runtime state synchronization, provider cleanup, URL validation, and JSON body limits
            - Retry-After aware provider cooldowns and visible LAN HTTP warning
            - Provider edit, test, enable/disable, and secure delete cleanup
            - Model aliases and provider-specific upstream model mapping
            - Priority/Round Robin routing selector and TTL-based sticky sessions
            - LAN IP allowlist, per-IP rate limiting, and protocol adapter fixture tests
            - Compile-fix follow-up for the security/test batch
            - Android-runtime protocol fixture tests prepared for device execution
            - Configurable concurrent request limit and upstream stream cleanup
